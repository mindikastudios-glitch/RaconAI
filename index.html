<style>
:root{--bg:#0f0f14;--side:#14141b;--surf:#1b1b25;--hov:#232331;--bd:#2a2a38;--tx:#ececf4;--mut:#9a9ab0;--ac:#7c5cff;--acx:#fff;--sel:#262046;--dg:#ef5b6b;--r:12px;color-scheme:dark}
:root[data-eff="light"]{--bg:#fafafc;--side:#f0f0f6;--surf:#fff;--hov:#e8e8f1;--bd:#dcdce8;--tx:#17171f;--mut:#62627a;--ac:#6a45f5;--sel:#e6e0ff;--dg:#c92f40;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut);transition:background .15s,color .15s}
.ib:hover{background:var(--hov);color:var(--tx)}
#app{display:flex;height:100%}
#side{width:290px;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:12px;gap:10px;transition:width .2s;flex:none;min-height:0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.tile{display:grid;place-items:center;flex:none}
.tile img{width:100%;height:100%;object-fit:contain;display:block}
.t36{width:55px;height:38px}.t56{width:67px;height:48px}:root[data-eff="dark"] .tile img,:root[data-eff="dark"] .fav{filter:invert(1)}
.newbtn{display:flex;align-items:center;gap:8px;justify-content:center;background:var(--ac);color:var(--acx);border-radius:var(--r);padding:10px;font-weight:600;transition:filter .15s}
.newbtn:hover{filter:brightness(1.1)}
.srch{display:flex;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:0 6px 0 10px;color:var(--mut)}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;padding:9px 0;color:var(--tx)}
.srch:focus-within{border-color:var(--ac)}
.srch .ib{width:28px;height:28px}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.ci{display:flex;align-items:center;border-radius:10px;position:relative}
.ci:hover{background:var(--hov)}
.ci.on{background:var(--sel)}
.ci .open{flex:1;min-width:0;text-align:left;padding:8px 4px 8px 10px;display:block}
.ci .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.ci .d{display:block;font-size:11.5px;color:var(--mut)}
.ci .ib{width:30px;height:30px;margin-right:4px}
.empty{color:var(--mut);text-align:center;padding:24px 8px;font-size:14px}
.sf{border-top:1px solid var(--bd);padding-top:10px}
.sf button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;color:var(--mut)}
.sf button:hover{background:var(--hov);color:var(--tx)}
.collapsed #side{width:64px;align-items:center}
.collapsed .lb,.collapsed .t56,.collapsed #list{display:none}
.collapsed .sh{flex-direction:column;gap:10px}
.collapsed .newbtn,.collapsed .sf button{width:40px;height:40px;padding:0;justify-content:center}
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:8px 14px;min-height:52px}
.top .mbtn{display:none}
#ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scroll{flex:1;overflow-y:auto;min-height:0}
#msgs{max-width:780px;margin:0 auto;padding:12px 18px 24px;display:flex;flex-direction:column;gap:22px;min-height:100%}
.welcome{margin:auto;text-align:center;padding:12px 0}
.welcome .tile{width:min(280px,72vw);margin:0 auto 18px}.welcome .tile img{height:auto}
.welcome h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
.welcome p{color:var(--mut);margin:0 0 20px}
.sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sug button{border:1px solid var(--bd);background:var(--surf);border-radius:999px;padding:8px 14px;font-size:14px;transition:border-color .15s,background .15s}
.sug button:hover{border-color:var(--ac);background:var(--hov)}
.m{display:flex;flex-direction:column;gap:6px;animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.m.u{align-items:flex-end}
.m.u .b{background:var(--sel);border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.m.a .b{overflow-wrap:anywhere;max-width:100%}
.m.a .b p{margin:0 0 .7em}.m.a .b p:last-child{margin:0}
.m.a pre{background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:10px;overflow-x:auto}
.m.a code{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.m.a a{color:var(--ac)}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.meta .ib{width:28px;height:28px}
.fl{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.fc{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:6px 10px 6px 6px;max-width:240px;font-size:13px}
.fc .th{width:38px;height:38px;border-radius:7px;background:var(--hov);display:grid;place-items:center;overflow:hidden;color:var(--mut);flex:none}
.fc .th img{width:100%;height:100%;object-fit:cover}
.fc .n{min-width:0}.fc .n b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .n span{color:var(--mut);font-size:11.5px}
.fc>.ib{width:24px;height:24px}
.dots{display:inline-flex;gap:4px;padding:8px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bn 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
#down{position:absolute;right:50%;transform:translateX(50%);bottom:158px;background:var(--surf);border:1px solid var(--bd);width:36px;height:36px;border-radius:50%;display:none;place-items:center;box-shadow:0 2px 8px #0004}
#down.show{display:grid}
.comp{max-width:780px;width:100%;margin:0 auto;padding:6px 18px 12px}
.box{background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:10px 10px 8px;transition:border-color .15s}
.box:focus-within{border-color:var(--ac)}
#att{display:flex;flex-wrap:wrap;gap:8px}
#att:not(:empty){margin-bottom:8px}
#ta{width:100%;resize:none;background:none;border:0;outline:0;padding:4px 6px;max-height:200px;display:block}
.row{display:flex;align-items:center;gap:8px;margin-top:4px}
.hint{flex:1;font-size:12px;color:var(--mut);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sendb{width:36px;height:36px;border-radius:50%;background:var(--ac);color:var(--acx);display:grid;place-items:center}
.note{text-align:center;font-size:12px;color:var(--mut);margin-top:8px}
#ov{display:none}
#menu{position:fixed;z-index:30;background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:4px;min-width:150px;box-shadow:0 8px 24px #0005}
#menu button{display:flex;gap:8px;align-items:center;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
#menu button:hover{background:var(--hov)}
#menu .dg{color:var(--dg)}
.mo{position:fixed;inset:0;z-index:40;background:#0008;display:grid;place-items:center;padding:16px;animation:in .15s}
.dlg{background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.dlg h2{margin:0 0 8px;font-size:18px}.dlg p{margin:0 0 14px;color:var(--mut)}
.dlg input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin-bottom:14px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.btn{padding:8px 16px;border-radius:10px;border:1px solid var(--bd);font-weight:500}
.btn:hover{background:var(--hov)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.btn.d{background:var(--dg);border-color:var(--dg);color:#fff}
.seg{display:flex;gap:6px;margin-bottom:16px}
.seg label{flex:1;display:flex;gap:6px;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:10px;padding:8px;cursor:pointer;font-size:14px}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){border-color:var(--ac);background:var(--sel)}
.seg label:has(input:focus-visible){outline:2px solid var(--ac)}
.sec{border-top:1px solid var(--bd);padding-top:14px;margin-top:14px}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.info{font-size:13.5px;color:var(--mut)}.info b{color:var(--tx);font-weight:500}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--surf);border:1px solid var(--bd);padding:8px 14px;border-radius:10px;font-size:14px;box-shadow:0 4px 16px #0004;animation:in .2s}
.toast.err{border-color:var(--dg)}
.mb{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px 0 10px;border-radius:10px;color:var(--mut);font-size:13.5px;font-weight:500;max-width:55%;margin-right:auto;transition:background .15s,color .15s}
.mb:hover,.mb[aria-expanded=true]{background:var(--hov);color:var(--tx)}
.mb .mn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mb svg{width:14px;height:14px}
#mmenu{position:fixed;z-index:30;background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:6px;width:min(350px,calc(100vw - 16px));box-shadow:0 8px 28px #0005;animation:in .15s}
.mi{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px;border-radius:10px;text-align:left;transition:background .15s}
.mi:hover{background:var(--hov)}.mi[aria-checked=true]{background:var(--sel)}
.mi .e{font-size:18px;line-height:1.35}.mi .x{flex:1;min-width:0}.mi b{font-weight:600}
.mi small{display:block;color:var(--mut);font-size:12.5px;line-height:1.4}
.mi .ck{color:var(--ac);width:18px;flex:none;margin-top:2px}
.tg{font-size:11px;border:1px solid var(--bd);border-radius:999px;padding:0 6px;color:var(--mut);margin-left:6px;font-weight:500}
.mnote{font-size:11.5px;color:var(--mut);padding:6px 10px 4px;border-top:1px solid var(--bd);margin-top:4px}
.btn{display:inline-flex;gap:6px;align-items:center;min-height:38px}

.cb{border:1px solid var(--bd);border-radius:12px;background:var(--surf);margin:.7em 0;overflow:hidden}
.cb .ch{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 2px 12px;background:var(--hov);font-size:12px;color:var(--mut)}
.cb .ch button{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:8px;color:var(--mut);font-size:12px;min-height:32px}
.cb .ch button:hover{color:var(--tx);background:var(--bd)}
.m.a .cb pre{margin:0;border:0;border-radius:0;padding:12px;overflow-x:auto;background:none}
.cb i{font-style:normal}.cb .k{color:var(--k)}.cb .s{color:var(--s)}.cb .c{color:var(--c)}.cb .n{color:var(--n)}

.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.sc{display:block;border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--surf);color:inherit;text-decoration:none;transition:border-color .15s,background .15s}
.sc:hover{border-color:var(--ac);background:var(--hov)}.sc .h{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12px}.sc .h svg{width:14px;height:14px}
.sc b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;font-weight:600;margin:4px 0 2px}.sc p{margin:0;font-size:12px;color:var(--mut)}
#amenu{position:fixed;z-index:30;background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:6px;min-width:190px;box-shadow:0 8px 28px #0005;animation:in .15s}
#amenu button{display:flex;gap:10px;align-items:center;width:100%;padding:11px 12px;border-radius:10px;min-height:44px;text-align:left}#amenu button:hover{background:var(--hov)}
.dlg.w{max-width:540px}.cam video{width:100%;border-radius:12px;background:#000;max-height:60vh;display:block;margin-bottom:12px}
.tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--bd);overflow-x:auto}
.tabs button{display:flex;gap:6px;align-items:center;padding:8px 10px;min-height:42px;color:var(--mut);font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}.tabs [aria-selected=true]{color:var(--tx);border-color:var(--ac)}
.tone{display:flex;gap:10px;align-items:flex-start;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;text-align:left}
.tone[aria-checked=true]{border-color:var(--ac);background:var(--sel)}.tone small{display:block;color:var(--mut);font-size:12.5px}
.mem{display:flex;gap:4px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:8px 4px 8px 10px;margin-bottom:6px;font-size:14px}.mem span{flex:1;overflow-wrap:anywhere}.mem small{color:var(--mut)}
.fld{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.fld input{flex:1;min-width:140px;margin:0!important}.dlg label.l{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
@media(max-width:800px){
#side{position:fixed;z-index:20;inset:0 auto 0 0;width:min(300px,86vw);transform:translateX(-100%);transition:transform .2s;padding-top:calc(12px + env(safe-area-inset-top,0))}
.open #side{transform:none}.open #ov{display:block;position:fixed;inset:0;background:#0007;z-index:15}
.collapsed #side{width:min(300px,86vw);align-items:stretch}
.collapsed .lb,.collapsed .t56{display:revert}.collapsed #list{display:flex}
.collapsed .sh{flex-direction:row}.collapsed .newbtn,.collapsed .sf button{width:auto;height:auto;padding:10px}
.collapsed .sf button{padding:9px 10px;justify-content:flex-start}
[data-act=collapse]{display:none}
.top .mbtn{display:grid}
.hint{display:none}.welcome h1{font-size:24px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const menu=$('#menu');
function openMenu(btn,id){menu.innerHTML=`<button role="menuitem" data-act="ren" data-id="${id}">${ic('pencil')}Renombrar</button><button role="menuitem" class="dg" data-act="del" data-id="${id}">${ic('trash')}Eliminar</button><button role="menuitem" data-act="mx">Cancelar</button>`;menu.hidden=false;
 const r=btn.getBoundingClientRect();menu.style.top=Math.min(r.bottom+4,innerHeight-menu.offsetHeight-8)+'px';menu.style.left=Math.max(8,Math.min(r.right-menu.offsetWidth,innerWidth-menu.offsetWidth-8))+'px';menu.querySelector('button').focus()}
const closeMenu=()=>{menu.hidden=true};
const mm=$('#mmenu'),mb=$('#modelb'),am=$('#amenu');
function closeAttach(){am.hidden=true;$('[data-act=attach]').setAttribute('aria-expanded','false')}
function openAttach(b){if(!am.hidden)return closeAttach();closeModels();
 am.innerHTML=[['camera','camera','Cámara'],['photos','img','Fotos'],['files','folder','Archivos']].map(([k,i,l])=>`<button role="menuitem" data-act="att" data-k="${k}">${ic(i)}${l}</button>`).join('');
 am.hidden=false;b.setAttribute('aria-expanded','true');const r=b.getBoundingClientRect(),h=am.offsetHeight,w=am.offsetWidth;
 am.style.top=(r.top-h-8>=8?r.top-h-8:r.bottom+8)+'px';am.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';am.querySelector('button').focus()}
am.addEventListener('keydown',e=>{const b=[...am.querySelectorAll('button')],i=b.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();b[(i+1)%b.length].focus()}if(e.key==='ArrowUp'){e.preventDefault();b[(i-1+b.length)%b.length].focus()}});
function camera(){if(matchMedia('(pointer:coarse)').matches||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return $('#fc').click();
 let stream,gone=false;
 dialog(`<h2>Cámara</h2><div class="cam"><video autoplay playsinline muted aria-label="Vista de la cámara"></video></div><div class="acts"><button class="btn" data-v="0">Cancelar</button><button class="btn p" id="snap" disabled>Tomar foto</button></div>`,(o,c)=>{
  const v=o.querySelector('video'),sn=o.querySelector('#snap');o.querySelector('[data-v]').onclick=()=>c();
  navigator.mediaDevices.getUserMedia({video:true}).then(st=>{if(gone){st.getTracks().forEach(t=>t.stop());return}stream=st;v.srcObject=st;sn.disabled=false}).catch(e=>{c();toast(e.name==='NotFoundError'?'No se encontró ninguna cámara. Usa «Fotos» para elegir una imagen.':e.name==='NotAllowedError'||e.name==='SecurityError'?'Permiso de cámara denegado. Actívalo en los ajustes del navegador.':'No se pudo acceder a la cámara.',1)});
  sn.onclick=()=>{const cv=document.createElement('canvas');cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext('2d').drawImage(v,0,0);cv.toBlob(b=>{if(!b)return toast('No se pudo capturar la foto.',1);c();const t=Date.now();addFiles([new File([b],'foto-'+t+'.jpg',{type:'image/jpeg',lastModified:t})])},'image/jpeg',.92)}
 }).then(()=>{gone=true;stream&&stream.getTracks().forEach(t=>t.stop())})}
function renderModel(){const m=model(prefs.model);mb.innerHTML=`<span aria-hidden="true">${m.icon}</span><span class="mn">${m.name}</span>${ic('chev')}`;mb.setAttribute('aria-label',`Modelo: ${m.name}. Cambiar modelo`)}
function closeModels(){mm.hidden=true;mb.setAttribute('aria-expanded','false')}
function openModels(){if(!mm.hidden)return closeModels();
 mm.innerHTML=MODELS.map(m=>`<button class="mi" role="menuitemradio" aria-checked="${m.id===prefs.model}" data-act="pickm" data-id="${m.id}"><span class="e" aria-hidden="true">${m.icon}</span><span class="x"><b>${m.name}</b>${m.def?'<span class="tg">Predeterminado</span>':''}<small>${m.tag}. ${m.desc}</small></span><span class="ck">${m.id===prefs.model?ic('check'):''}</span></button>`).join('')+'<div class="mnote">La selección se guarda en este dispositivo. Los modelos se conectarán a un motor de IA próximamente.</div>';
 mm.hidden=false;mb.setAttribute('aria-expanded','true');const r=mb.getBoundingClientRect(),h=mm.offsetHeight,w=mm.offsetWidth;
 mm.style.top=(r.top-h-8>=8?r.top-h-8:Math.min(r.bottom+8,innerHeight-h-8))+'px';mm.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';(mm.querySelector('[aria-checked=true]')||mm.querySelector('button')).focus()}
mm.addEventListener('keydown',e=>{const b=[...mm.querySelectorAll('.mi')],i=b.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();b[(i+1)%b.length].focus()}if(e.key==='ArrowUp'){e.preventDefault();b[(i-1+b.length)%b.length].focus()}});
document.addEventListener('mousedown',e=>{if(!menu.hidden&&!menu.contains(e.target)&&!e.target.closest('[data-act=cmenu]'))closeMenu();if(!mm.hidden&&!mm.contains(e.target)&&!e.target.closest('#modelb'))closeModels();if(!am.hidden&&!am.contains(e.target)&&!e.target.closest('[data-act=attach]'))closeAttach()});addEventListener('resize',()=>{closeModels();closeAttach()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();closeModels();closeAttach();app.classList.remove('open')}});
/* Archivos */
function addFiles(list){let added=0;for(const f of list){
 if(!OK.includes(ext(f.name))){toast(`«${f.name}» no es un tipo admitido (PNG, JPG, WEBP, PDF, TXT, MD, CSV, JSON).`,1);continue}
 if(f.size>10485760){toast(`«${f.name}» supera los 10 MB.`,1);continue}
 if(pending.some(p=>p.name===f.name&&p.size===f.size&&p.mod===f.lastModified)){toast(`«${f.name}» ya está adjunto.`,1);continue}
 if(pending.length>=5){toast('Máximo 5 archivos por mensaje.',1);break}
 const id=uid();let url=null;if(IMG.includes(ext(f.name)))url=URL.createObjectURL(f);previews.set(id,url);pending.push({id,name:f.name,type:f.type,size:f.size,mod:f.lastModified,url});added++}
 if(added)toast(added+(added>1?' archivos adjuntados':' archivo adjuntado'));renderAtt()}
/* Envío */
function send(){if(busy)return stop();const t=ta.value.trim();if(!t&&!pending.length)return;
 const c=cur(),m={id:uid(),role:'user',content:t,at:Date.now(),files:pending.map(({id,name,type,size})=>({id,name,type,size})),model:prefs.model};
 c.messages.push(m);c.updated=Date.now();if(c.messages.length===1&&!c.renamed)c.title=mkTitle(t||pending[0].name);
 pending=[];ta.value='';resize();
 const tok=uid(),ctx=buildContext(t);ctx.messages=c.messages.filter(x=>(x.role==='user'||x.role==='assistant')&&typeof x.content==='string'&&x.content.trim()).map(x=>({role:x.role,content:x.content}));busy={convId:c.id,tok,model:prefs.model,ctx,timer:setTimeout(()=>reply(c.id,tok),1400)};
 save();render();toBottom(true);ta.focus()}
async function reply(id,tok){if(!busy||busy.tok!==tok)return;let text;try{text=await AIService.reply({model:model(busy.model),context:busy.ctx})}catch{if(busy&&busy.tok===tok){busy=null;updSend();renderChat();toast('El modelo seleccionado no está disponible. No se cambió a otro.',1)}return}if(!busy||busy.tok!==tok)return;busy=null;const c=conv(id);
 if(c){c.messages.push({id:uid(),role:'assistant',content:text,at:Date.now()});c.updated=Date.now();save()}
 renderList();updSend();if(id===data.active){renderChat();near()&&toBottom()}}
function stop(){if(!busy)return;clearTimeout(busy.timer);busy=null;render(1);toast('Respuesta detenida')}
/* Acciones */
async function newChat(){if(ta.value.trim()||pending.length){if(!await confirmDlg('¿Descartar el mensaje?','Tienes texto o archivos sin enviar. Se perderán.','Descartar',1))return}
 pending=[];ta.value='';resize();newConv();render();app.classList.remove('open');ta.focus()}
const A={
 new:newChat,settings,models:openModels,pickm:b=>{prefs.model=model(b.dataset.id).id;Store.set('rcn.prefs',prefs);renderModel();closeModels();ta.focus();toast('Modelo: '+model(prefs.model).name)},close:()=>app.classList.remove('open'),menu:()=>app.classList.add('open'),
 collapse:()=>app.classList.toggle('collapsed'),
 clearq:()=>{$('#q').value='';q='';renderList();$('#q').focus()},
 attach:openAttach,att:b=>{closeAttach();const k=b.dataset.k;k==='camera'?camera():$(k==='photos'?'#fp':'#fi').click()},copycode:async b=>{const t=b.closest('.cb').querySelector('code').textContent,l=b.querySelector('span');try{await navigator.clipboard.writeText(t);b.querySelector('svg').outerHTML=ic('check');l.textContent='Copiado';setTimeout(()=>{b.querySelector('svg').outerHTML=ic('copy');l.textContent='Copiar código'},1600)}catch{toast('No se pudo copiar al portapapeles.',1)}},send,down:()=>toBottom(),
 sug:(b)=>{ta.value=b.textContent;resize();updSend();ta.focus()},
 open:b=>{data.active=b.dataset.id;app.classList.remove('open');render()},
 cmenu:b=>openMenu(b,b.dataset.id),ren:b=>{closeMenu();rename(b.dataset.id)},del:b=>{closeMenu();del(b.dataset.id)},mx:closeMenu,
 rmf:b=>{const f=pending.find(p=>p.id===b.dataset.id);if(f&&f.url)URL.revokeObjectURL(f.url);pending=pending.filter(p=>p!==f);renderAtt()},
 copy:async b=>{const m=cur().messages.find(x=>x.id===b.dataset.id);try{await navigator.clipboard.writeText(m.content);b.innerHTML=ic('check');toast('Copiado');setTimeout(()=>b.innerHTML=ic('copy'),1600)}catch{toast('No se pudo copiar al portapapeles.',1)}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b)});
ta.addEventListener('input',()=>{resize();updSend()});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
['fi','fp','fc'].forEach(id=>$('#'+id).addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''}));
$('#q').addEventListener('input',e=>{q=e.target.value;renderList()});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();addFiles([...e.dataTransfer.files])});
iconize();renderModel();applyNick();if(!prefs.sidebarStart&&innerWidth>800)app.classList.add('collapsed');
render();
</script>
</body>
</html>
